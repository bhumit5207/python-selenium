<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>File Upload Download</title>
</head>
<body>
    <h1>File Upload / Download</h1>
    <input id="fileUpload" type="file" />
    <div id="uploadMessage" style="margin-top: 10px; color: green;"></div>
    <a id="downloadLink" href="data:text/plain;charset=utf-8,Sample%20download%20content" download="sample.txt">Download sample file</a>

    <script>
        document.getElementById('fileUpload').addEventListener('change', function () {
            var filename = this.files[0] ? this.files[0].name : 'No file';
            document.getElementById('uploadMessage').innerText = 'Uploaded: ' + filename;
        });
    </script>
</body>
</html>
