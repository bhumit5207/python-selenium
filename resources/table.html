<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Table Validation</title>
</head>
<body>
    <h1>Sample Data Table</h1>
    <table id="sampleTable" border="1" cellpadding="6">
        <thead>
            <tr><th>Name</th><th>Age</th><th>City</th></tr>
        </thead>
        <tbody>
            <tr><td>Alice</td><td>29</td><td>New York</td></tr>
            <tr><td>Bob</td><td>34</td><td>London</td></tr>
            <tr><td>Charlie</td><td>23</td><td>Sydney</td></tr>
        </tbody>
    </table>
</body>
</html>
