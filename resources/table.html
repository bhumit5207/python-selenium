<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Table Validation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 40px;
            font-size: 28px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        .table-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.5px;
        }
        td {
            padding: 14px 16px;
            border-bottom: 1px solid #e0e0e0;
            color: #333;
            font-size: 14px;
        }
        tbody tr {
            transition: all 0.3s ease;
        }
        tbody tr:hover {
            background-color: #f5f5f5;
            transform: scale(1.01);
            box-shadow: inset 0 0 10px rgba(102, 126, 234, 0.1);
        }
        tbody tr:nth-child(odd) {
            background-color: #f9f9f9;
        }
        tbody tr:nth-child(odd):hover {
            background-color: #f0f0f0;
        }
        tbody td {
            transition: color 0.3s ease;
        }
        tbody tr:hover td {
            color: #667eea;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <h1>Sample Data Table</h1>
    <div class="table-container">
        <table id="sampleTable">
            <thead>
                <tr><th>Name</th><th>Age</th><th>City</th></tr>
            </thead>
            <tbody>
                <tr><td>Alice</td><td>29</td><td>New York</td></tr>
                <tr><td>Bob</td><td>34</td><td>London</td></tr>
                <tr><td>Charlie</td><td>23</td><td>Sydney</td></tr>
            </tbody>
        </table>
    </div>
